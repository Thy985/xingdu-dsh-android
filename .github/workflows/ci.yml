name: CI

# JVM 测试 + lint + 构建 + 插件契约检查。
# Git 仓库不含约 211 MiB 的 runtime.zip：优先从 Actions 缓存恢复，
# 冷启动时从 GitHub Release 源码包下载并解出，再经 verify-runtime.py 静态校验。
# 仪器测试不在此自动运行（GitHub 托管 runner 无 KVM），由 instrumented 任务手动触发。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' was delisted from the SDK repository; platform 35/build-tools come later.
          packages: platform-tools

      - name: Install SDK components and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0" > /dev/null

      - name: Restore split runtime assets from cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/runtime.zip
            app/src/main/jniLibs
          key: runtime-${{ hashFiles('app/src/main/assets/runtime-manifest.json') }}

      - name: Fetch runtime assets from release source archive
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.0-dev-preview
          ASSET: Xingdu-DSH-0.2.0-dev-source.zip
        run: |
          # Draft releases are invisible to the by-tag endpoint; resolve via
          # the releases list, then fetch the asset as an octet-stream.
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -1)
          if [ -z "$RELEASE_ID" ]; then echo "release $RELEASE_TAG not found" >&2; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq ".[] | select(.name == \"$ASSET\") | .url" > /tmp/asset.url
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" "$(cat /tmp/asset.url)" \
            -o /tmp/source.zip
          # Release source zips have carried different top-level prefixes
          # (dsh-android-native/, xingdu-dsh-android/); match by suffix instead.
          unzip -p /tmp/source.zip "*/app/src/main/assets/runtime.zip" \
            > app/src/main/assets/runtime.zip
          # Split layout: the five jniLibs components ride in the same archive.
          unzip -o /tmp/source.zip "*/app/src/main/jniLibs/*" -d /tmp/jnilibs-extract \
            > /dev/null 2>&1 || true
          if [ -d /tmp/jnilibs-extract ]; then
            mkdir -p app/src/main/jniLibs
            cp -r /tmp/jnilibs-extract/*/app/src/main/jniLibs/* app/src/main/jniLibs/
            rm -rf /tmp/jnilibs-extract
          fi
          rm /tmp/source.zip

      - name: Verify runtime archive (static, never executes binaries)
        run: |
          FLAG=""
          if [ -f app/src/main/assets/runtime-native-manifest.json ]; then
            FLAG="--layout split --jni-dir app/src/main/jniLibs/arm64-v8a"
          fi
          python3 scripts/runtime/verify-runtime.py \
            app/src/main/assets/runtime.zip --arch aarch64 $FLAG

      - name: Build mobile shell addon assets
        run: python3 scripts/build-mobile-shell.py

      - name: JVM tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Assemble app and AndroidTest APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Mobile shell contract test
        run: node tests/mobile-shell-contract.cjs

      - name: Upload reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/
          if-no-files-found: warn

  # 实验性：手动触发的仪器测试。macOS runner 可无 KVM 跑 x86_64 模拟器；
  # 固件为 fixture 测试，不依赖 ARM64 运行时解包。未验证通过前不阻塞 CI。
  instrumented:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK components and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" \
            "platform-tools" "emulator" > /dev/null

      - name: Restore runtime.zip from cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/runtime.zip
          key: runtime-${{ hashFiles('app/src/main/assets/runtime-manifest.json') }}

      - name: Fetch runtime.zip from release source archive
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.0-dev-preview
          ASSET: Xingdu-DSH-0.2.0-dev-source.zip
        run: |
          # Draft releases are invisible to the by-tag endpoint; resolve via
          # the releases list, then fetch the asset as an octet-stream.
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -1)
          if [ -z "$RELEASE_ID" ]; then echo "release $RELEASE_TAG not found" >&2; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq ".[] | select(.name == \"$ASSET\") | .url" > /tmp/asset.url
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" "$(cat /tmp/asset.url)" \
            -o /tmp/source.zip
          # Release source zips have carried different top-level prefixes
          # (dsh-android-native/, xingdu-dsh-android/); match by suffix instead.
          unzip -p /tmp/source.zip "*/app/src/main/assets/runtime.zip" \
            > app/src/main/assets/runtime.zip
          rm /tmp/source.zip

      - name: Build mobile shell addon assets
        run: python3 scripts/build-mobile-shell.py

      - name: Run instrumentation tests on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/outputs/androidTest/connected/
          if-no-files-found: warn
