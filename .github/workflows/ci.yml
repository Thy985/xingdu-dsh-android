name: CI

# JVM 测试 + lint + 构建 + 插件契约检查。
# Git 仓库不含约 211 MiB 的 runtime.zip：优先从 Actions 缓存恢复，
# 冷启动时从 GitHub Release 源码包下载并解出，再经 verify-runtime.py 静态校验。
# 仪器测试不在此自动运行（GitHub 托管 runner 无 KVM），由 instrumented 任务手动触发。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" > /dev/null

      - name: Restore runtime.zip from cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/runtime.zip
          key: runtime-${{ hashFiles('app/src/main/assets/runtime-manifest.json') }}

      - name: Fetch runtime.zip from release source archive
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.8-dev-preview
          ASSET: Xingdu-DSH-0.1.8-dev-source.zip
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --output /tmp/source.zip
          unzip -p /tmp/source.zip \
            dsh-android-native/app/src/main/assets/runtime.zip \
            > app/src/main/assets/runtime.zip
          rm /tmp/source.zip

      - name: Verify runtime archive (static, never executes binaries)
        run: |
          python3 scripts/runtime/verify-runtime.py \
            app/src/main/assets/runtime.zip --arch aarch64

      - name: Build mobile shell addon assets
        run: python3 scripts/build-mobile-shell.py

      - name: JVM tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Assemble app and AndroidTest APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Mobile shell contract test
        run: node tests/mobile-shell-contract.cjs

      - name: Upload reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/
          if-no-files-found: warn

  # 实验性：手动触发的仪器测试。macOS runner 可无 KVM 跑 x86_64 模拟器；
  # 固件为 fixture 测试，不依赖 ARM64 运行时解包。未验证通过前不阻塞 CI。
  instrumented:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" \
            "platform-tools" "emulator" > /dev/null

      - name: Restore runtime.zip from cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/runtime.zip
          key: runtime-${{ hashFiles('app/src/main/assets/runtime-manifest.json') }}

      - name: Fetch runtime.zip from release source archive
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.8-dev-preview
          ASSET: Xingdu-DSH-0.1.8-dev-source.zip
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --output /tmp/source.zip
          unzip -p /tmp/source.zip \
            dsh-android-native/app/src/main/assets/runtime.zip \
            > app/src/main/assets/runtime.zip
          rm /tmp/source.zip

      - name: Build mobile shell addon assets
        run: python3 scripts/build-mobile-shell.py

      - name: Run instrumentation tests on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/outputs/androidTest/connected/
          if-no-files-found: warn
